<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>忍界幸存者</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #74a334; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- 美术、特效、字体都打包在 assets.js（python3 tools/build_assets.py 生成） -->
<script src="assets.js"></script>
<script>
// ===== 画布 =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PX = 3, FXP = 1.5; // 角色/道具 1 个美术像素 = 3 个世界单位；pixelfx 特效 1 像素 = 1.5
let W, H, DPR, S, VW, VH;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  // 长边大约看到 900 世界单位，并且让 1.5 个世界单位刚好是整数个屏幕像素，像素才整齐
  const n = Math.max(1, Math.round(FXP * Math.max(W, H) / 900 * DPR));
  S = n / (FXP * DPR);
  VW = W / S; VH = H / S;
}
addEventListener('resize', resize); resize();

const FONT = 'FusionPixel';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ===== 像素美术：Ninja Adventure 素材 + 运行时换色 =====
const IMG = {}, ART = {};
const loadImg = k => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = ASSETS[k]; });
function canvasOf(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); return c; }
// 逐像素改色：fn(r, g, b) 返回新颜色，返回空就不改；描边色 #141b1b 永远不动
function tint(img, fn) {
  const c = canvasOf(img), x = c.getContext('2d'), id = x.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3] || (d[i] === 20 && d[i + 1] === 27 && d[i + 2] === 27)) continue;
    const v = fn(d[i], d[i + 1], d[i + 2]);
    if (v) [d[i], d[i + 1], d[i + 2]] = v;
  }
  x.putImageData(id, 0, 0); return c;
}
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const swap = map => { const M = new Map(Object.entries(map).map(([a, b]) => [hex(a).join(), hex(b)])); return (r, g, b) => M.get(`${r},${g},${b}`); };
// 精灵表：每帧 fw×fh，附带一张全白的受击版
const sheet = (c, fw, fh = fw) => ({ c, flash: tint(c, (r, g, b) => [r + (255 - r) * 0.7, g + (255 - g) * 0.7, b + (255 - b) * 0.7]), fw, fh, cols: Math.floor(c.width / fw) });

// 主角和晓成员都用素材包的 Boy 改色：头发 #d14b34/#965340，皮肤 #ef914f，衣服 #548789
const HERO = {
  naruto: { '#d14b34': '#ffd23f', '#965340': '#d99a1c', '#548789': '#f37b1d', '#2e3939': '#26262e', '#51614e': '#2c4a9a' },
  sasuke: { '#d14b34': '#2b3152', '#965340': '#191c30', '#548789': '#2a3550', '#e3f1f5': '#e9e9ee' },
  sakura: { '#d14b34': '#ff9ec7', '#965340': '#d9679b', '#548789': '#d9324a', '#2e3939': '#3a3f4a' },
};
const CLOAK = { '#548789': '#1b1a22', '#e3f1f5': '#d7262e', '#2e3939': '#0e0d12', '#51614e': '#d7262e' }; // 黑袍红云
const AKA = {
  '迪达拉': { ...CLOAK, '#d14b34': '#ffd84d', '#965340': '#d9a520' },
  '干柿鬼鲛': { ...CLOAK, '#d14b34': '#2c4f86', '#965340': '#1d3560', '#ef914f': '#7fa3c4' },
  '角都': { ...CLOAK, '#d14b34': '#3e4656', '#965340': '#2a303c', '#ef914f': '#a77c55' },
  '飞段': { ...CLOAK, '#d14b34': '#d3d9e2', '#965340': '#9aa3b0', '#ef914f': '#f3cdb0' },
  '佩恩': { ...CLOAK, '#d14b34': '#e8752a', '#965340': '#b0501a' },
};

// 地面：用草地格子随机拼一大块，再平铺
function makeGround() {
  const floor = IMG['sprites/floor'], det = IMG['sprites/floor-detail'], N = 24;
  const c = document.createElement('canvas'); c.width = c.height = N * 16;
  const x = c.getContext('2d');
  let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const col = rnd() < 0.55 ? 11 : 12 + Math.floor(rnd() * 4); // 第 12 行第 11~15 格是绿草
    x.drawImage(floor, col * 16, 12 * 16, 16, 16, i * 16, j * 16, 16, 16);
    if (rnd() < 0.08) x.drawImage(det, Math.floor(rnd() * 8) * 16, 32, 16, 16, i * 16, j * 16, 16, 16); // 草丛、小花
  }
  return c;
}

function buildArt() {
  const hero = IMG['sprites/hero'], gem = IMG['sprites/gem'];
  for (const [id, map] of Object.entries({ ...HERO, ...AKA })) ART[id] = sheet(tint(hero, swap(map)), 16);
  ART.zetsu = sheet(tint(IMG['sprites/zetsu'], swap({ '#d14b34': '#6fb84a', '#d3a2c0': '#d9ddd2' })), 16);
  ART.sound = sheet(canvasOf(IMG['sprites/sound']), 16);
  ART.bomb = sheet(canvasOf(IMG['sprites/bomber']), 16);
  ART.dog = sheet(canvasOf(IMG['sprites/dog']), 16);
  ART.bird = sheet(tint(IMG['sprites/bird'], (r, g, b) => { const v = 170 + (r + g + b) / 9; return [v, v * 0.97, v * 0.88]; }), 16); // 黏土鸟：白色
  ART.shark = sheet(tint(IMG['sprites/shark'], (r, g, b) => [r * 0.3, g * 0.55 + 20, Math.min(255, b * 0.9 + 40)]), 16); // 水鲛：蓝色
  ART.shuriken = sheet(canvasOf(IMG['sprites/shuriken']), 16);
  ART.rsk = sheet(canvasOf(IMG['sprites/bigshuriken']), 23);
  ART.kunai = sheet(canvasOf(IMG['sprites/kunai']), 14, 5);
  ART.ramen = sheet(canvasOf(IMG['sprites/ramen']), 16);
  ART.scroll = sheet(canvasOf(IMG['sprites/scroll']), 14);
  ART.chest = sheet(canvasOf(IMG['sprites/chest']), 16);
  ART.dynamite = sheet(canvasOf(IMG['sprites/dynamite']), 16);
  ART.flame = sheet(canvasOf(IMG['sprites/flame']), 25, 30);
  ART.gem = sheet(tint(gem, (r, g, b) => [r * 0.3, Math.min(255, g * 0.8 + 50), Math.min(255, b * 1.2 + 40)]), 16); // 蓝 = 1 点经验
  ART.gemBig = sheet(canvasOf(gem), 16); // 紫 = 2~5 点
  ART.gold = sheet(tint(gem, (r, g, b) => [Math.min(255, r * 1.2 + 70), Math.min(255, g * 1.1 + 60), b * 0.3]), 16); // 金 = Boss
  ART.ground = makeGround();
  IMG['fx/orb'] = tint(IMG['fx/orb'], (r, g, b) => [g, r * 0.6 + g * 0.4, b]); // arcane-orb 原本是紫的，换成螺旋丸的蓝
}

// ===== 角色 =====
const CHARS = [
  { id: 'naruto', name: '鸣人', start: 'clones', hp: 120, speed: 220, dmg: 1, regen: 0, ult: '九尾模式', color: '255,150,40', desc: '影分身起手 · 血量 120' },
  { id: 'sasuke', name: '佐助', start: 'chidori', hp: 90, speed: 240, dmg: 1.15, regen: 0, ult: '须佐能乎', color: '160,110,255', desc: '千鸟起手 · 伤害 +15% · 跑得快' },
  { id: 'sakura', name: '小樱', start: 'tags', hp: 100, speed: 220, dmg: 1, regen: 0.7, ult: '百豪之术', color: '255,120,180', desc: '起爆符起手 · 每秒回 0.7 血' },
];

// ===== 忍术（武器）、被动道具、进化 =====
const WEAPONS = {
  shuriken: { name: '手里剑', icon: 'shuriken', desc: '自动瞄准最近的敌人', up: ['', '数量 +1', '伤害 +30%', '数量 +1', '数量 +1，可穿透'] },
  rasengan: { name: '螺旋丸', icon: 'orbwater', desc: '绕着身体转的查克拉球', up: ['', '数量 +1', '转圈范围变大', '数量 +1', '数量 +1，伤害 +50%'] },
  chidori: { name: '千鸟', icon: 'bookthunder', desc: '闪电在敌人之间连锁弹跳', up: ['', '多弹 1 次', '冷却 -20%', '多弹 2 次', '伤害 +50%'] },
  fireball: { name: '豪火球', icon: 'fireball', desc: '朝前方喷火球，爆炸留下火海', up: ['', '爆炸范围 +20%', '冷却 -20%', '火海烧得更久', '伤害 +50%'] },
  clones: { name: '影分身', icon: 'mist', desc: '分身在身边帮你扔手里剑', up: ['', '分身 +1', '投掷更快', '分身 +1', '分身 +1'] },
  tags: { name: '起爆符', icon: 'explosion', desc: '在脚下埋雷，怪踩上就爆', up: ['', '埋得更快', '爆炸范围 +20%', '一次埋 2 张', '伤害 +50%'] },
};
const PASSIVES = {
  haste: { name: '疾风', icon: 'bookwind', desc: '所有忍术冷却 -8%' },
  power: { name: '查克拉强化', icon: 'attackupgrade', desc: '所有伤害 +15%' },
  swift: { name: '瞬身术', icon: 'boot', desc: '移动速度 +8%' },
  body: { name: '仙人体质', icon: 'heal', desc: '最大生命 +20 并回满' },
  pact: { name: '通灵契约', icon: 'scroll', desc: '吸取范围 +30%，攻击范围 +10%' },
};
// 忍术满级 + 搭档（忍术也要满级，被动有就行）→ 进化
const EVOS = [
  { from: 'shuriken', need: 'rasengan', name: '风遁·螺旋手里剑', icon: 'orblight', desc: '手里剑 + 螺旋丸满级：飞出去炸一大片' },
  { from: 'chidori', need: 'haste', name: '雷切', icon: 'bookthunder', desc: '千鸟满级 + 疾风：一次两道闪电，各弹 12 次' },
  { from: 'fireball', need: 'power', name: '豪火灭却', icon: 'orbfire', desc: '豪火球满级 + 查克拉强化：一次喷 5 发' },
];

const lvOf = id => P.w[id]?.lv || 0;
const pv = id => P.p[id] || 0;
const DMG = () => (1 + 0.15 * pv('power')) * CH.dmg;
const CD = () => Math.pow(0.92, pv('haste'));
const AREA = () => 1 + 0.1 * pv('pact');
const canEvolve = e => lvOf(e.from) >= 5 && !P.w[e.from].evo && (WEAPONS[e.need] ? lvOf(e.need) >= 5 : pv(e.need) > 0);

function makeChoices() {
  const evo = EVOS.filter(canEvolve).map(e => ({ evo: e }));
  const pool = shuffle([
    ...Object.keys(WEAPONS).filter(id => lvOf(id) < 5).map(id => ({ w: id })),
    ...Object.keys(PASSIVES).filter(id => pv(id) < 5).map(id => ({ p: id })),
  ]);
  const out = [...evo, ...pool].slice(0, 3);
  return out.length ? out : [{ ramen: true }];
}
function cardInfo(c) {
  if (c.evo) return { icon: c.evo.icon, name: '进化！' + c.evo.name, desc: c.evo.desc, gold: true };
  if (c.w) { const w = WEAPONS[c.w], lv = lvOf(c.w); return { icon: w.icon, name: lv ? `${w.name} Lv${lv + 1}` : `新忍术：${w.name}`, desc: lv ? w.up[lv] : w.desc }; }
  if (c.p) { const p = PASSIVES[c.p]; return { icon: p.icon, name: `${p.name} Lv${pv(c.p) + 1}`, desc: p.desc }; }
  return { icon: 'ramen', name: '一乐拉面', desc: '回复 50 生命' };
}
function apply(c) {
  if (c.evo) P.w[c.evo.from].evo = true;
  else if (c.w) { if (P.w[c.w]) P.w[c.w].lv++; else P.w[c.w] = { lv: 1, cd: 0 }; }
  else if (c.p) { P.p[c.p] = pv(c.p) + 1; if (c.p === 'body') { P.maxHp += 20; P.hp = P.maxHp; } }
  else P.hp = Math.min(P.maxHp, P.hp + 50);
}

// ===== 游戏状态 =====
const BOSSES = ['迪达拉', '干柿鬼鲛', '角都', '飞段', '佩恩']; // 每 2 分钟按顺序登场
let best = +localStorage.getItem('ninjabonk_best') || 0;
let state = 'loading', CH = CHARS[0], P, foes, bullets, shots, gems, items, fires, mines, warns, zones, fx, pops;
let t, kills, spawnCD, lvl, xp, xpNeed, choices, shake, newBest, bossN, nextRing, ringN, banner;

function start(i) {
  CH = CHARS[i];
  P = { x: 0, y: 0, r: 16, hp: CH.hp, maxHp: CH.hp, hurt: 0, face: 1, moving: false, dirX: 0, dirY: 1, kx: 0, ky: 0,
        rage: 0, rageMax: 150, ult: 0, w: { [CH.start]: { lv: 1, cd: 0 } }, p: {} };
  foes = []; bullets = []; shots = []; gems = []; items = []; fires = []; mines = []; warns = []; zones = []; fx = []; pops = [];
  t = 0; kills = 0; spawnCD = 0; lvl = 1; xp = 0; xpNeed = 3; shake = 0; bossN = 0; nextRing = 100; ringN = 0;
  banner = { text: '', life: 0 };
  state = 'play';
}
function pick(i) { if (choices[i]) { apply(choices[i]); state = 'play'; } }

// 播一个 pixelfx 特效（序列帧放完自动消失）
function play(key, x, y, { scale = 1, rot = 0, speed = 1, center = false } = {}) {
  if (fx.length > 220) return; // 同屏特效太多就不播了
  const m = FXMETA[key], max = m.n / m.fps / speed;
  fx.push({ key, x, y, scale, rot, speed, center, life: max, max });
}

// 大招：清掉屏幕上的怪，之后 6 秒无敌 + 加速 + 身边灼烧光环
function ult() {
  if (P.rage < P.rageMax || P.ult > 0) return;
  P.rage = 0; P.rageMax += 75; P.ult = 6; shake = 12; // 每放一次，下次要攒更久
  banner = { text: CH.ult + '！', life: 1.8 };
  if (CH.id === 'sakura') { P.hp = P.maxHp; play('heal', P.x, P.y + P.r, { scale: 2 }); }
  for (const f of foes) if (Math.abs(f.x - P.x) < VW / 2 && Math.abs(f.y - P.y) < VH / 2) hitFoe(f, 60 * DMG(), f.x - P.x, f.y - P.y);
  play('mana', P.x, P.y + P.r, { scale: 2 });
  fx.push({ flash: CH.color, life: 0.4, max: 0.4 });
}

// ===== 输入：键盘 + 按住拖动摇杆 =====
const keys = {};
let joy = null;
const inR = (e, r) => e.clientX > r.x && e.clientX < r.x + r.w && e.clientY > r.y && e.clientY < r.y + r.h;
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  const n = +e.key;
  if (state === 'menu' && n >= 1 && n <= 3) start(n - 1);
  else if (state === 'level' && n >= 1 && n <= choices.length) pick(n - 1);
  else if (state === 'over' && (e.key === ' ' || e.key === 'Enter')) state = 'menu';
  else if (state === 'play' && e.key === ' ') ult();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
cv.addEventListener('pointerdown', e => {
  if (state === 'menu') charRects().forEach((r, i) => inR(e, r) && start(i));
  else if (state === 'over') state = 'menu';
  else if (state === 'level') cardRects().forEach((r, i) => inR(e, r) && pick(i));
  else if (state === 'play' && P.rage >= P.rageMax && inR(e, ultRect())) ult();
  else if (state === 'play') joy = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => { if (joy) { joy.x = e.clientX; joy.y = e.clientY; } });
addEventListener('pointerup', () => joy = null);
addEventListener('pointercancel', () => joy = null);

// ===== 战斗工具 =====
function nearest(x, y, maxD = Infinity, skip) {
  let best = null, bd = maxD * maxD;
  for (const f of foes) {
    if (f.hp <= 0 || skip?.has(f)) continue;
    const d = (f.x - x) ** 2 + (f.y - y) ** 2;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}
function hitFoe(f, dmg, kx, ky) {
  if (f.hp <= 0) return;
  f.hp -= dmg; f.hit = 0.25;
  const k = Math.hypot(kx, ky) || 1, push = 160 / f.r; // 击退，个头越大越推不动
  f.x += kx / k * push; f.y += ky / k * push;
  if (pops.length < 150) pops.push({ x: f.x, y: f.y - f.r * 2, text: Math.round(dmg), life: 0.6 });
  if (f.hp > 0) return;
  kills++;
  play('poof', f.x, f.y + f.r, { scale: f.r > 25 ? 2 : 1, speed: 2 });
  if (!(P.ult > 0)) P.rage = Math.min(P.rageMax, P.rage + f.rage);
  gems.push({ x: f.x, y: f.y, v: { boss: 30, big: 5, sound: 2 }[f.kind] || 1 });
  const r = Math.random();
  if (f.kind === 'boss' || (f.kind === 'big' && r < 0.05)) items.push({ x: f.x + 24, y: f.y, kind: 'chest' });
  else if (r < 0.012) items.push({ x: f.x, y: f.y, kind: 'ramen' });
  else if (r < 0.018) items.push({ x: f.x, y: f.y, kind: 'scroll' });
}
// 范围爆炸，伤所有怪；look = 用哪个 pixelfx 特效
function boom(x, y, r, dmg, look = 'pow') {
  for (const f of foes) if (f.hp > 0 && (f.x - x) ** 2 + (f.y - y) ** 2 < (r + f.r) ** 2) hitFoe(f, dmg, f.x - x, f.y - y);
  play(look, x, y);
}
function hurt(dmg) {
  if (P.hurt > 0 || P.ult > 0) return;
  P.hp -= dmg; P.hurt = 0.7; shake = 10;
  play('hitspark', P.x, P.y);
}
// 敌人那边的爆炸：伤主角，也顺带炸伤周围的怪
function blast(x, y, r, dmg) {
  if (dist2(P, { x, y }) < (r + P.r) ** 2) hurt(dmg);
  boom(x, y, r, dmg, 'blast');
}
function throwStar(x, y, dmg, n = 1, pierce = 0) {
  const f = nearest(x, y, 600);
  if (!f) return;
  const base = Math.atan2(f.y - y, f.x - x);
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.18;
    bullets.push({ kind: 'star', x, y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 8, life: 1.2, dmg, pierce, hit: new Set() });
  }
}
function shoot(x, y, a, sp, kind, dmg, life = 3) {
  shots.push({ kind, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: kind === 'shark' ? 14 : 10, dmg, life });
}

// 每种忍术每帧怎么出手
const TICK = {
  shuriken(w, dt) {
    if ((w.cd -= dt) > 0) return;
    if (w.evo) { // 螺旋手里剑：碰到就炸一大片
      w.cd = 1.2 * CD();
      const f = nearest(P.x, P.y, 600);
      if (!f) return;
      const a = Math.atan2(f.y - P.y, f.x - P.x), r = 130 * AREA(), dmg = 60 * DMG();
      bullets.push({ kind: 'rsk', x: P.x, y: P.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 22, life: 1.4, hit: new Set(),
                     boom: b => boom(b.x, b.y, r, dmg, 'plasma') });
      return;
    }
    w.cd = [0.6, 0.6, 0.55, 0.5, 0.45][w.lv - 1] * CD();
    throwStar(P.x, P.y, (w.lv >= 3 ? 13 : 10) * DMG(), [1, 2, 2, 3, 4][w.lv - 1], w.lv >= 5 ? 1 : 0);
  },
  rasengan(w, dt) {
    const n = [1, 2, 2, 3, 4][w.lv - 1], R = (w.lv >= 3 ? 100 : 85) * AREA(), dmg = (w.lv >= 5 ? 22 : 15) * DMG();
    w.ang = (w.ang || 0) + dt * 3;
    w.pos = [];
    for (let i = 0; i < n; i++) {
      const a = w.ang + i * TAU / n, ox = P.x + Math.cos(a) * R, oy = P.y + Math.sin(a) * R;
      w.pos.push([ox, oy]);
      for (const f of foes) if (f.hp > 0 && f.hit <= 0 && (f.x - ox) ** 2 + (f.y - oy) ** 2 < (f.r + 18) ** 2) hitFoe(f, dmg, f.x - P.x, f.y - P.y);
    }
  },
  chidori(w, dt) {
    if ((w.cd -= dt) > 0) return;
    w.cd = (w.evo ? 0.8 : [2, 2, 1.6, 1.6, 1.6][w.lv - 1]) * CD();
    const jumps = w.evo ? 12 : [3, 4, 4, 6, 6][w.lv - 1], dmg = (w.evo ? 40 : w.lv >= 5 ? 27 : 18) * DMG(), seen = new Set();
    for (let k = 0; k < (w.evo ? 2 : 1); k++) {
      const pts = [[P.x, P.y]];
      let x = P.x, y = P.y, range = 350;
      for (let i = 0; i < jumps; i++) {
        const f = nearest(x, y, range, seen);
        if (!f) break;
        seen.add(f); hitFoe(f, dmg, f.x - x, f.y - y);
        play('zap', f.x, f.y, { rot: Math.atan2(f.y - y, f.x - x) }); // 电弧从上一个目标打过来
        pts.push([f.x, f.y]); x = f.x; y = f.y; range = 220;
      }
      if (pts.length > 1) fx.push({ bolt: pts, life: 0.25, max: 0.25 });
    }
  },
  fireball(w, dt) {
    if ((w.cd -= dt) > 0) return;
    w.cd = (w.evo ? 2 : [2.5, 2.5, 2, 2, 2][w.lv - 1]) * CD();
    const r = (w.lv >= 2 ? 84 : 70) * AREA() * (w.evo ? 1.3 : 1), dmg = (w.lv >= 5 ? 38 : 25) * DMG(), burn = w.lv >= 4 ? 3.5 : 2;
    const base = Math.atan2(P.dirY, P.dirX), n = w.evo ? 5 : 1;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * 0.3;
      bullets.push({ kind: 'fire', x: P.x, y: P.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, r: 14, life: 1.1, hit: new Set(),
                     boom: b => { boom(b.x, b.y, r, dmg); fires.push({ x: b.x, y: b.y, r: r * 0.8, life: burn, tick: 0, dmg: dmg * 0.25 }); } });
    }
  },
  clones(w, dt) {
    const n = [1, 1, 2, 2, 3][w.lv - 1];
    w.ang = (w.ang || 0) + dt * 0.8;
    w.pos = [];
    for (let i = 0; i < n; i++) { const a = w.ang + i * TAU / n; w.pos.push([P.x + Math.cos(a) * 70, P.y + Math.sin(a) * 55]); }
    if ((w.cd -= dt) > 0) return;
    w.cd = (w.lv >= 3 ? 0.65 : 0.9) * CD();
    for (const [x, y] of w.pos) throwStar(x, y, (w.lv >= 2 ? 12 : 10) * DMG());
  },
  tags(w, dt) {
    if ((w.cd -= dt) > 0) return;
    w.cd = (w.lv >= 2 ? 1.1 : 1.5) * CD();
    const r = (w.lv >= 3 ? 96 : 80) * AREA(), dmg = (w.lv >= 5 ? 45 : 30) * DMG();
    for (let i = 0; i < (w.lv >= 4 ? 2 : 1); i++) mines.push({ x: P.x + rand(-30, 30), y: P.y + rand(-30, 30), r, dmg, life: 8, arm: 0.4 });
    if (mines.length > 14) mines.shift();
  },
};

// Boss 专属招式，每 5 秒放一次（冲刺照旧）
const BOSS_SKILL = {
  '迪达拉': f => { const a = Math.atan2(P.y - f.y, P.x - f.x); for (let i = -1; i <= 1; i++) shoot(f.x, f.y - 30, a + i * 0.6, 170, 'bird', 15, 4); },
  '干柿鬼鲛': f => { const a = Math.atan2(P.y - f.y, P.x - f.x); for (let i = -2; i <= 2; i++) shoot(f.x, f.y, a + i * 0.22, 300, 'shark', 15); },
  '角都': () => { for (let i = 0; i < 5; i++) warns.push({ x: P.x + rand(-90, 90), y: P.y + rand(-90, 90), r: 45, delay: 0.9 + i * 0.12, max: 0.9 + i * 0.12, dmg: 18, color: '60,50,80', look: 'hands' }); },
  '飞段': () => { zones.push({ x: P.x, y: P.y, r: 95, life: 5, dps: 8 }); },
  '佩恩': f => { warns.push({ x: f.x, y: f.y, r: 230, delay: 1.1, max: 1.1, dmg: 15, push: true, color: '150,110,255', look: 'mana' }); },
};

const FOES = { // 血量倍率、半径、速度、碰撞伤害、攒大招能量
  zetsu: { r: 16, hp: 1, dmg: 10, rage: 1 },
  big: { r: 30, hp: 6, speed: 60, dmg: 15, rage: 3 },
  sound: { r: 16, hp: 1.5, speed: 110, dmg: 8, rage: 2 },
  dog: { r: 12, hp: 0.6, speed: 255, dmg: 8, rage: 1 },
  bomb: { r: 17, hp: 0.8, speed: 150, dmg: 0, rage: 1 },
};
function spawnFoe(kind, x, y) { // 血量 3 分钟后加速涨，碰撞伤害随时间涨
  const k = FOES[kind];
  foes.push({ kind, x, y, r: k.r, hp: (8 + t / 10 + 8 * (Math.max(0, t - 180) / 60) ** 2) * k.hp, dmg: k.dmg * (1 + t / 300), rage: k.rage, hit: 0, ph: Math.random() * 6, cd: rand(1, 2.5),
              speed: k.speed || Math.min(180, rand(70, 100) + t / 5) });
}

// ===== 每帧逻辑 =====
function update(dt) {
  t += dt;
  shake = Math.max(0, shake - dt * 30);

  // 移动（加上被神罗天征弹飞的惯性）
  let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (joy) { mx = joy.x - joy.x0; my = joy.y - joy.y0; }
  const m = Math.hypot(mx, my), speed = CH.speed * (1 + 0.08 * pv('swift')) * (P.ult > 0 ? 1.3 : 1);
  P.moving = m > (joy ? 8 : 0);
  if (P.moving) {
    P.x += mx / m * speed * dt; P.y += my / m * speed * dt;
    P.dirX = mx / m; P.dirY = my / m;
    if (mx) P.face = Math.sign(mx);
  }
  const kd = Math.pow(0.03, dt);
  P.x += P.kx * dt; P.y += P.ky * dt; P.kx *= kd; P.ky *= kd;
  P.hurt -= dt;
  P.hp = Math.min(P.maxHp, P.hp + CH.regen * dt);
  if (P.ult > 0) {
    P.ult -= dt;
    for (const f of foes) if (f.hp > 0 && f.hit <= 0 && dist2(f, P) < 140 ** 2) hitFoe(f, 20 * DMG(), f.x - P.x, f.y - P.y);
  }

  // 刷怪：越往后越密、越肉，种类越多
  const R = Math.hypot(VW, VH) / 2 + 40; // 刚好在屏幕外的一圈
  spawnCD -= dt;
  if (spawnCD <= 0 && foes.length < 360) {
    spawnCD = Math.max(0.3, 1.2 - t / 200);
    for (let i = 1 + Math.floor(t / 90); i > 0; i--) {
      const a = Math.random() * TAU, x = P.x + Math.cos(a) * R, y = P.y + Math.sin(a) * R, roll = Math.random();
      if (t > 120 && roll < 0.05) for (let k = 0; k < 3; k++) spawnFoe('dog', x + rand(-30, 30), y + rand(-30, 30));
      else if (t > 90 && roll < 0.13 && foes.filter(f => f.kind === 'sound').length < 6) spawnFoe('sound', x, y); // 音忍最多 6 个
      else if (t > 180 && roll < 0.23) spawnFoe('bomb', x, y);
      else spawnFoe(Math.random() < Math.min(0.15, t / 600) ? 'big' : 'zetsu', x, y);
    }
  }
  // 事件：白绝包围圈，一圈怪同时往里收
  if (t >= nextRing) {
    const n = 24 + 8 * ringN++;
    nextRing += 120;
    for (let i = 0; i < n; i++) { const a = i * TAU / n; spawnFoe('zetsu', P.x + Math.cos(a) * R * 0.85, P.y + Math.sin(a) * R * 0.85); }
    banner = { text: '白绝包围了！', life: 2 };
  }
  // Boss：每 2 分钟来一个晓成员，一个比一个肉
  if (t >= (bossN + 1) * 120) {
    const a = Math.random() * TAU, name = BOSSES[bossN % BOSSES.length], hp = 300 * (bossN + 1) ** 2;
    foes.push({ kind: 'boss', name, x: P.x + Math.cos(a) * R, y: P.y + Math.sin(a) * R, r: 40, hp, maxHp: hp, speed: 140,
                dmg: 25, rage: 30, hit: 0, ph: 0, cd: 2, skill: 3 });
    banner = { text: `晓 · ${name} 来了！`, life: 2.5 };
    bossN++;
  }

  // 怪的行动
  for (const f of foes) {
    const dx = P.x - f.x, dy = P.y - f.y, d = Math.hypot(dx, dy) || 1;
    if (d > R + 200) { // 被甩远的怪绕到屏幕边重新包过来，光跑是跑不掉的
      const a = Math.random() * TAU;
      f.x = P.x + Math.cos(a) * R; f.y = P.y + Math.sin(a) * R;
      continue;
    }
    let sp = f.speed, ux = dx / d, uy = dy / d;
    if (f.kind === 'boss') { // 放招时站住；蓄力 0.8 秒（地上红框预警）→ 冲刺 0.5 秒 → 冷却 3 秒
      if (f.cast > 0) { sp = 0; f.cast -= dt; }
      else if (f.charge > 0) { sp = 0; if ((f.charge -= dt) <= 0) f.dash = 0.5; }
      else if (f.dash > 0) { sp = 600; ux = Math.cos(f.aim); uy = Math.sin(f.aim); if ((f.dash -= dt) <= 0) f.cd = 3; }
      else if ((f.skill -= dt) <= 0) { f.skill = 5; f.cast = f.name === '佩恩' ? 1.1 : 0.5; BOSS_SKILL[f.name](f); }
      else if ((f.cd -= dt) <= 0) { f.charge = 0.8; f.aim = Math.atan2(dy, dx); }
    } else if (f.kind === 'sound') { // 走到一定距离就站住扔苦无
      if (d < 260) sp = 0;
      if ((f.cd -= dt) <= 0 && d < 420) { f.cd = 3.5; shoot(f.x, f.y, Math.atan2(dy, dx), 230, 'kunai', 6); }
    } else if (f.kind === 'bomb') { // 贴身后点燃引信，0.6 秒后爆炸
      if (f.fuse > 0) {
        sp = 0; f.hit = Math.floor(t * 12) % 2 ? 0.15 : 0;
        if ((f.fuse -= dt) <= 0) { f.dead = true; blast(f.x, f.y, 75, 20); }
      } else if (d < 50) f.fuse = 0.6;
    }
    f.moving = sp > 0;
    f.x += ux * sp * dt; f.y += uy * sp * dt;
    if (f.kind !== 'bomb') f.hit -= dt;
    if (d < f.r + P.r && f.dmg) hurt(f.dmg);
  }
  // ponytail: O(n²) 互相推开，360 只以内够用；怪再多就换网格分桶
  for (let i = 0; i < foes.length; i++) for (let j = i + 1; j < foes.length; j++) {
    const a = foes[i], b = foes[j], dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r, d2 = dx * dx + dy * dy;
    if (d2 < min * min && d2 > 0.01) {
      const d = Math.sqrt(d2), pa = (min - d) * b.r / min, pb = (min - d) * a.r / min; // 小的给大的让路
      a.x -= dx / d * pa; a.y -= dy / d * pa; b.x += dx / d * pb; b.y += dy / d * pb;
    }
  }

  // 忍术出手
  for (const id in P.w) TICK[id](P.w[id], dt);
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const f of foes) if (f.hp > 0 && !b.hit.has(f) && (f.x - b.x) ** 2 + (f.y - b.y) ** 2 < (f.r + b.r) ** 2) {
      if (b.boom) { b.life = 0; break; } // 火球、螺旋手里剑碰到就炸
      hitFoe(f, b.dmg, b.vx, b.vy); b.hit.add(f);
      if (b.pierce-- <= 0) { b.life = 0; break; }
    }
    if (b.life <= 0 && b.boom) b.boom(b);
  }
  bullets = bullets.filter(b => b.life > 0);
  for (const m of mines) {
    m.arm -= dt; m.life -= dt;
    if (m.life <= 0 || (m.arm <= 0 && foes.some(f => f.hp > 0 && dist2(f, m) < (f.r + 30) ** 2))) { m.life = 0; boom(m.x, m.y, m.r, m.dmg); }
  }
  mines = mines.filter(m => m.life > 0);
  for (const z of fires) {
    z.life -= dt;
    if ((z.tick -= dt) <= 0) { z.tick = 0.4; for (const f of foes) if (dist2(f, z) < (z.r + f.r) ** 2) hitFoe(f, z.dmg, 0, 0); }
  }
  fires = fires.filter(z => z.life > 0);
  foes = foes.filter(f => f.hp > 0 && !f.dead);

  // 敌人的飞行道具：苦无、黏土鸟（会拐弯，到时间或碰到就炸）、水鲛弹
  for (const s of shots) {
    if (s.kind === 'bird') {
      const a = Math.atan2(s.vy, s.vx), want = Math.atan2(P.y - s.y, P.x - s.x), sp = Math.hypot(s.vx, s.vy);
      const na = a + Math.max(-1.5 * dt, Math.min(1.5 * dt, Math.atan2(Math.sin(want - a), Math.cos(want - a))));
      s.vx = Math.cos(na) * sp; s.vy = Math.sin(na) * sp;
    }
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (dist2(s, P) < (s.r + P.r) ** 2) { if (s.kind !== 'bird') hurt(s.dmg); s.life = 0; }
    if (s.life <= 0 && s.kind === 'bird') blast(s.x, s.y, 55, s.dmg);
  }
  shots = shots.filter(s => s.life > 0);
  // 预警圈：时间到就判定（角都的触手、佩恩的神罗天征）
  for (const w of warns) if ((w.delay -= dt) <= 0) {
    const dx = P.x - w.x, dy = P.y - w.y, d = Math.hypot(dx, dy) || 1;
    if (d < w.r + P.r) { hurt(w.dmg); if (w.push) { P.kx = dx / d * 900; P.ky = dy / d * 900; } }
    if (w.push) for (const f of foes) if (f.kind !== 'boss' && dist2(f, w) < (w.r * 1.5) ** 2) {
      const fd = Math.hypot(f.x - w.x, f.y - w.y) || 1;
      f.x += (f.x - w.x) / fd * 150; f.y += (f.y - w.y) / fd * 150;
    }
    play(w.look, w.x, w.y + (w.push ? 40 : 20), { scale: w.push ? 2 : 0.5 });
  }
  warns = warns.filter(w => w.delay > 0);
  // 飞段的诅咒阵：站在里面持续掉血
  for (const z of zones) { z.life -= dt; if (!(P.ult > 0) && dist2(P, z) < z.r ** 2) P.hp -= z.dps * dt; }
  zones = zones.filter(z => z.life > 0);

  // 查克拉（经验）：进范围后被吸过来；通灵卷轴会吸全屏
  const magnet = 120 * (1 + 0.3 * pv('pact'));
  for (const g of gems) {
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy);
    if (d < P.r + 6) { g.taken = true; xp += g.v; continue; }
    if (d < magnet) g.pull = true;
    if (g.pull) { const sp = g.fast ? 900 : 500; g.x += dx / d * sp * dt; g.y += dy / d * sp * dt; }
  }
  gems = gems.filter(g => !g.taken);
  // 掉落：拉面回血、卷轴吸经验、宝箱白送一次升级（能进化优先进化）
  for (const it of items) if (dist2(it, P) < (P.r + 18) ** 2) {
    it.taken = true;
    if (it.kind === 'ramen') { P.hp = Math.min(P.maxHp, P.hp + 30); pops.push({ x: P.x, y: P.y - 50, text: '+30', life: 1, color: '#7dff8a' }); play('heal', P.x, P.y + P.r); }
    else if (it.kind === 'scroll') { for (const g of gems) g.pull = g.fast = true; play('collect', P.x, P.y + P.r); }
    else { const c = makeChoices()[0]; banner = { text: '宝箱：' + cardInfo(c).name, life: 2 }; apply(c); play('collect', P.x, P.y + P.r, { scale: 2 }); }
  }
  items = items.filter(i => !i.taken);
  if (xp >= xpNeed) {
    xp -= xpNeed; lvl++; xpNeed = Math.floor(xpNeed * 1.15) + 2;
    choices = makeChoices();
    state = 'level'; joy = null;
  }

  banner.life -= dt;
  for (const e of fx) e.life -= dt;
  fx = fx.filter(e => e.life > 0);
  for (const p of pops) { p.life -= dt; p.y -= 30 * dt; }
  pops = pops.filter(p => p.life > 0);

  if (P.hp <= 0) {
    state = 'over'; joy = null; newBest = t > best;
    if (newBest) { best = t; localStorage.setItem('ninjabonk_best', best); }
  }
}

// ===== 绘制 =====
let K = 1, camX = 0, camY = 0; // K = 世界单位 → 设备像素
const snap = v => Math.round(v * K) / K; // 对齐到屏幕像素，像素画不糊不抖
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
// 像素字体只在 12 的整数倍字号下清楚；描边用四向偏移 1 个字体像素
function text(s, x, y, size, color = '#fff', align = 'center') {
  const fs = Math.max(12, Math.round(size / 12) * 12), o = fs / 12;
  ctx.font = `${fs}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = '#141b1b';
  for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o]]) ctx.fillText(s, x + dx, y + dy);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = '#141b1b'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#3a3f4a'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), h);
}
function card(r, stroke) {
  ctx.fillStyle = '#141b1b'; ctx.fillRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6);
  ctx.fillStyle = stroke; ctx.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2);
  ctx.fillStyle = '#262a35'; ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
}
const icon = (key, cx, cy, size) => ctx.drawImage(IMG['icons/' + key] || IMG['sprites/' + key], Math.round(cx - size / 2), Math.round(cy - size / 2), size, size);
const stack = (n, h) => { const w = Math.min(340, W - 40), gap = 14; return Array.from({ length: n }, (_, i) => ({ x: Math.round((W - w) / 2), y: Math.round(H / 2 - (h * n + gap * (n - 1)) / 2 + i * (h + gap)), w, h })); };
const cardRects = () => stack(choices.length, 84);
const charRects = () => stack(3, 84).map(r => ({ ...r, y: r.y + 30 }));
const ultRect = () => ({ x: Math.round(W / 2 - 110), y: H - 52, w: 220, h: 44 });

// 精灵表画第 f 帧，(x, y) 是中心
function frame(s, f, x, y, k, rot = 0, flip = false, flash = false) {
  const w = s.fw * k, h = s.fh * k, sx = (f % s.cols) * s.fw, sy = Math.floor(f / s.cols) * s.fh, img = flash ? s.flash : s.c;
  if (!rot && !flip) return ctx.drawImage(img, sx, sy, s.fw, s.fh, snap(x - w / 2), snap(y - h / 2), w, h);
  ctx.save(); ctx.translate(snap(x), snap(y)); if (rot) ctx.rotate(rot); if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, sx, sy, s.fw, s.fh, -w / 2, -h / 2, w, h); ctx.restore();
}
// 角色表：4 列朝向（下 上 左 右）× 若干行动作，前 4 行是走路；(x, y) 是脚底
const dirOf = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0);
function actor(s, dir, row, x, y, k, flash) {
  const w = s.fw * k, h = s.fh * k;
  ctx.drawImage(flash ? s.flash : s.c, dir * s.fw, row * s.fh, s.fw, s.fh, snap(x - w / 2), snap(y - h), w, h);
}
// pixelfx 序列帧：默认对准它自己的落点（pivot），center 时对准帧中心
function drawFx(key, f, x, y, scale = 1, rot = 0, center = false) {
  const m = FXMETA[key], k = FXP * scale, sx = (f % m.cols) * m.w, sy = Math.floor(f / m.cols) * m.h;
  const ax = center ? m.w / 2 : m.pivot[0], ay = center ? m.h / 2 : m.pivot[1];
  ctx.save(); ctx.translate(snap(x), snap(y)); if (rot) ctx.rotate(rot);
  ctx.drawImage(IMG['fx/' + key], sx, sy, m.w, m.h, -ax * k, -ay * k, m.w * k, m.h * k); ctx.restore();
}
const loopFrame = (key, time) => { const m = FXMETA[key]; return Math.floor(time * m.fps) % m.n; };
// 像素风闪电：沿折线一格一格盖方块
function pixLine(x0, y0, x1, y1, size) {
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / size));
  for (let i = 0; i <= n; i++) ctx.fillRect(snap(x0 + (x1 - x0) * i / n - size / 2), snap(y0 + (y1 - y0) * i / n - size / 2), size, size);
}

function camera(cx, cy, sh = 0) {
  K = DPR * S; camX = cx; camY = cy;
  ctx.setTransform(K, 0, 0, K, Math.round(DPR * (W / 2 + rand(-sh, sh)) - cx * K), Math.round(DPR * (H / 2 + rand(-sh, sh)) - cy * K));
}
function drawGround(cx, cy) {
  const T = ART.ground.width * PX, x0 = Math.floor((cx - VW / 2) / T) * T, y0 = Math.floor((cy - VH / 2) / T) * T;
  for (let x = x0; x < cx + VW / 2; x += T) for (let y = y0; y < cy + VH / 2; y += T) ctx.drawImage(ART.ground, x, y, T, T);
}

const SCALE = { zetsu: PX, big: PX * 2, sound: PX, dog: PX, bomb: PX, boss: PX * 2 };
function drawWorld() {
  camera(P.x, P.y, shake);
  drawGround(P.x, P.y);

  // —— 地面层 ——
  for (const z of zones) { // 飞段的诅咒阵：红圈 + 倒三角
    ctx.fillStyle = 'rgba(200,20,30,.18)'; circle(z.x, z.y, z.r);
    ctx.strokeStyle = '#c4161f'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU);
    for (let i = 0; i <= 3; i++) { const a = Math.PI / 2 + i * TAU / 3; ctx[i ? 'lineTo' : 'moveTo'](z.x + Math.cos(a) * z.r, z.y + Math.sin(a) * z.r); }
    ctx.stroke();
  }
  for (const z of fires) { // 火海：一圈像素火苗
    ctx.fillStyle = 'rgba(255,120,40,.16)'; circle(z.x, z.y, z.r);
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 5, rr = i ? z.r * 0.55 : 0;
      frame(ART.flame, Math.floor(t * 12 + i * 3) % 8, z.x + Math.cos(a) * rr, z.y + Math.sin(a) * rr - 20, FXP);
    }
  }
  for (const w of warns) { // 预警圈：从中心往外长，长满就判定
    const k = 1 - w.delay / w.max;
    ctx.fillStyle = `rgba(${w.color},.15)`; circle(w.x, w.y, w.r);
    ctx.fillStyle = `rgba(${w.color},.35)`; circle(w.x, w.y, w.r * k);
    ctx.strokeStyle = `rgb(${w.color})`; ctx.lineWidth = 3; ctx.setLineDash([10, 6]);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const f of foes) if (f.charge > 0) { // Boss 冲刺路线
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.aim);
    ctx.fillStyle = `rgba(255,30,30,${0.3 + 0.2 * Math.sin(t * 25)})`; ctx.fillRect(0, -f.r, 300, f.r * 2);
    ctx.strokeStyle = '#ff2a2a'; ctx.lineWidth = 3; ctx.setLineDash([14, 8]); ctx.strokeRect(0, -f.r, 300, f.r * 2);
    ctx.restore(); // restore 也会清掉虚线
  }
  if (P.ult > 0) { ctx.fillStyle = `rgba(${CH.color},${0.18 + 0.08 * Math.sin(t * 15)})`; circle(P.x, P.y, 140); } // 大招光环范围
  for (const g of gems) frame(g.v >= 30 ? ART.gold : g.v > 1 ? ART.gemBig : ART.gem, 0, g.x, g.y + Math.round(Math.sin(t * 5 + g.x)) * FXP, g.v >= 30 ? FXP : FXP / 2);
  for (const it of items) frame(ART[it.kind], 0, it.x, it.y - 6 + Math.round(Math.sin(t * 4 + it.x)) * PX, PX);
  for (const m of mines) frame(ART.dynamite, 0, m.x, m.y, FXP);

  // —— 怪按 y 排序，下面的挡住上面的；先统一画影子 ——
  const cw = P.w.clones, pdir = dirOf(P.dirX, P.dirY), prow = P.moving ? Math.floor(t * 8) % 4 : 0;
  if (cw?.pos) { ctx.globalAlpha = 0.55; for (const [x, y] of cw.pos) actor(ART[CH.id], pdir, prow, x, y + P.r, PX); ctx.globalAlpha = 1; }
  const actors = foes.slice().sort((a, b) => a.y - b.y);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath();
  for (const a of actors.concat(P)) { ctx.moveTo(a.x + a.r, a.y + a.r * 0.9); ctx.ellipse(a.x, a.y + a.r * 0.9, a.r, a.r * 0.38, 0, 0, TAU); }
  ctx.fill();
  for (const a of actors) {
    if (a.kind === 'dog') { // 动物只有侧面两帧，画的是朝右
      frame(ART.dog, Math.floor(t * 10 + a.ph) % 2, a.x, a.y + a.r - 8 * PX, PX, 0, P.x < a.x, a.hit > 0.1);
    } else {
      const s = a.kind === 'boss' ? ART[a.name] : ART[a.kind === 'big' ? 'zetsu' : a.kind];
      actor(s, dirOf(P.x - a.x, P.y - a.y), a.moving ? Math.floor(t * 8 + a.ph) % 4 : 0, a.x, a.y + a.r, SCALE[a.kind], a.hit > 0.1);
    }
  }

  // —— 飞行道具和特效 ——
  for (const b of bullets) {
    if (b.kind === 'star') frame(ART.shuriken, Math.floor(t * 20) % 2, b.x, b.y, FXP);
    else if (b.kind === 'rsk') { drawFx('orb', loopFrame('orb', t), b.x, b.y, 0.6, 0, true); frame(ART.rsk, Math.floor(t * 20) % 2, b.x, b.y, FXP * 2); }
    else drawFx('fireball', loopFrame('fireball', t), b.x, b.y, 1, Math.atan2(b.vy, b.vx));
  }
  for (const [x, y] of P.w.rasengan?.pos || []) drawFx('orb', loopFrame('orb', t + x * 0.01), x, y, 1, 0, true);
  for (const s of shots) {
    if (s.kind === 'kunai') frame(ART.kunai, 0, s.x, s.y, FXP, Math.atan2(s.vy, s.vx));
    else if (s.kind === 'bird') frame(ART.bird, Math.floor(t * 8) % 2, s.x, s.y, PX, 0, s.vx < 0); // 鸟画的是朝右，两帧扇翅膀
    else frame(ART.shark, 0, s.x, s.y, PX, 0, s.vx > 0); // 鱼只用第 1 帧（朝左），第 2 帧是跳起来的
  }
  for (const e of fx) {
    if (e.flash) continue;
    if (e.bolt) { // 千鸟的电弧：每帧随机抖动的像素折线
      const k = e.life / e.max, pts = e.bolt;
      ctx.globalAlpha = k;
      for (const [c, size] of [['#6cc4ff', FXP * 3], ['#f2fbff', FXP]]) {
        ctx.fillStyle = c;
        for (let i = 1; i < pts.length; i++) {
          const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2 + rand(-14, 14), my = (y0 + y1) / 2 + rand(-14, 14);
          pixLine(x0, y0, mx, my, size); pixLine(mx, my, x1, y1, size);
        }
      }
      ctx.globalAlpha = 1;
      continue;
    }
    const m = FXMETA[e.key];
    drawFx(e.key, Math.min(m.n - 1, Math.floor((e.max - e.life) * m.fps * e.speed)), e.x, e.y, e.scale, e.rot, e.center);
  }
  if (!(P.hurt > 0 && Math.floor(t * 20) % 2)) actor(ART[CH.id], pdir, prow, P.x, P.y + P.r, PX); // 主角最后画，不被特效挡住；受伤闪烁
}

// 世界坐标 → 屏幕坐标（文字在屏幕空间画才清楚）
const toScreen = (x, y) => [(x - camX) * S + W / 2, (y - camY) * S + H / 2];
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (const f of foes) if (f.kind === 'boss') { const [x, y] = toScreen(f.x, f.y - 70); text(f.name, x, y, 12, '#ff6b5b'); }
  for (const p of pops) {
    const [x, y] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.min(1, p.life / 0.6); ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#141b1b'; ctx.fillText(p.text, Math.round(x) + 1, Math.round(y) + 1);
    ctx.fillStyle = p.color || '#fff'; ctx.fillText(p.text, Math.round(x), Math.round(y));
  }
  ctx.globalAlpha = 1;
  for (const e of fx) if (e.flash) { ctx.fillStyle = `rgba(${e.flash},${0.5 * e.life / e.max})`; ctx.fillRect(0, 0, W, H); }

  ctx.fillStyle = '#141b1b'; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = '#4fb3ff'; ctx.fillRect(0, 0, Math.round(W * xp / xpNeed), 6);
  const bw = Math.min(150, Math.round(W / 2 - 80)); // 窄屏别压到中间的计时
  ctx.drawImage(IMG['sprites/heart'], 14, 18, 28, 24);
  bar(48, 22, bw, 12, P.hp / P.maxHp, '#ff4d5e');
  text(`Lv ${lvl}`, 14, 52, 12, '#fff', 'left');
  text(fmt(t), W / 2, 30, 24);
  text(`击败 ${kills}`, W - 14, 28, 12, '#fff', 'right');

  // 已学的忍术（★ = 已进化）和被动
  let x = 14;
  for (const id in P.w) {
    const w = P.w[id];
    icon(w.evo ? EVOS.find(e => e.from === id).icon : WEAPONS[id].icon, x + 12, 82, 24);
    text(w.evo ? '★' : String(w.lv), x + 22, 96, 12, w.evo ? '#ffd23f' : '#fff');
    x += 30;
  }
  x += 8;
  for (const id in P.p) { icon(PASSIVES[id].icon, x + 12, 82, 24); text(String(P.p[id]), x + 22, 96, 12); x += 30; }

  const boss = foes.find(f => f.kind === 'boss');
  if (boss) {
    const w = Math.min(400, W - 40);
    text(`晓 · ${boss.name}`, W / 2, 60, 12, '#ff6b5b');
    bar(Math.round((W - w) / 2), 72, w, 8, boss.hp / boss.maxHp, '#d32f2f');
  }
  if (banner.life > 0) {
    ctx.globalAlpha = Math.min(1, banner.life);
    text(banner.text, W / 2, H * 0.3, 36, '#ff6b5b');
    ctx.globalAlpha = 1;
  }

  // 大招能量条（满了点它或按空格）
  const r = ultRect(), col = `rgb(${CH.color})`;
  if (P.ult > 0) { bar(r.x, r.y + 20, r.w, 10, P.ult / 6, col); text(CH.ult, W / 2, r.y + 4, 12, col); }
  else {
    bar(r.x, r.y + 20, r.w, 10, P.rage / P.rageMax, P.rage >= P.rageMax ? col : '#c9cfc4');
    if (P.rage >= P.rageMax) text(`${CH.ult}！按空格 / 点这里`, W / 2, r.y + 4, 12, Math.floor(t * 4) % 2 ? '#fff' : col);
    else text(CH.ult, W / 2, r.y + 4, 12, '#eee');
  }

  if (joy) { // 虚拟摇杆
    ctx.fillStyle = 'rgba(255,255,255,.15)'; circle(joy.x0, joy.y0, 50);
    const dx = joy.x - joy.x0, dy = joy.y - joy.y0, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; circle(joy.x0 + Math.cos(a) * d, joy.y0 + Math.sin(a) * d, 20);
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#74a334'; ctx.fillRect(0, 0, W, H);
  if (state === 'loading') { text('加载中…', W / 2, H / 2, 24); return; }

  if (state === 'menu') {
    const now = performance.now() / 1000;
    camera(now * 20, now * 10); drawGround(now * 20, now * 10); // 背景草地慢慢飘
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const rs = charRects();
    text('忍界幸存者', W / 2, rs[0].y - 66, 48, '#ffb43a');
    text('白绝大军来袭，每 2 分钟晓组织登场', W / 2, rs[0].y - 28, 12);
    rs.forEach((r, i) => {
      const c = CHARS[i], col = `rgb(${c.color})`, s = ART[c.id];
      card(r, col);
      ctx.drawImage(s.c, 0, (Math.floor(now * 6 + i) % 4) * 16, 16, 16, r.x + 12, r.y + 10, 64, 64); // 原地踏步
      text(`${i + 1}. ${c.name}`, r.x + 88, r.y + 22, 24, col, 'left');
      text(c.desc, r.x + 88, r.y + 50, 12, '#fff', 'left');
      text(`大招：${c.ult}`, r.x + 88, r.y + 68, 12, '#c9cfc4', 'left');
    });
    const y = rs[2].y + rs[2].h;
    text('点角色开始 · WASD / 方向键移动 · 手机按住拖动', W / 2, y + 28, 12, '#fff');
    if (best) text(`最高纪录 ${fmt(best)}`, W / 2, y + 52, 12, '#ffe08a');
    return;
  }

  drawWorld();
  drawHUD();

  if (state === 'level') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    const rs = cardRects();
    text('升级！选一个', W / 2, rs[0].y - 30, 24, '#ffe08a');
    rs.forEach((r, i) => {
      const c = cardInfo(choices[i]);
      card(r, c.gold ? '#ffd23f' : '#ff9a2e');
      icon(c.icon, r.x + 42, r.y + r.h / 2, 48);
      text(`${i + 1}. ${c.name}`, r.x + 80, r.y + 30, c.name.length > 9 ? 12 : 24, c.gold ? '#ffd23f' : '#ffb43a', 'left');
      text(c.desc, r.x + 80, r.y + 60, 12, '#fff', 'left');
    });
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    text('你倒下了', W / 2, H / 2 - 60, 48, '#ff6b5b');
    text(`${CH.name} · 存活 ${fmt(t)} · 击败 ${kills} · Lv ${lvl}`, W / 2, H / 2, 12);
    text(newBest ? '新纪录！' : `最高纪录 ${fmt(best)}`, W / 2, H / 2 + 30, 12, '#ffe08a');
    text('点击或按空格回到选人', W / 2, H / 2 + 80, 24);
  }
}

// ===== 主循环 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
// 先把图片、字体都加载好、换好色，再开始
(async () => {
  if (!window.ASSETS) return document.body.textContent = '缺少 assets.js，请和 ninja-bonk.html 放在同一个文件夹';
  requestAnimationFrame(loop);
  await Promise.all(Object.keys(ASSETS).filter(k => k.startsWith('sprites/') || k.startsWith('icons/') || k.startsWith('fx/')).map(async k => IMG[k] = await loadImg(k)));
  document.fonts.add(await new FontFace(FONT, `url(${ASSETS['font/fusion-pixel-12px-zh_hans']})`).load());
  buildArt();
  state = 'menu';
})();
</script>
</body>
</html>
